name: Build jar

# Builds Click's Client in the cloud so you do not need Java or Gradle installed.
# Upload this folder to a GitHub repository, open the Actions tab, and run "Build jar"
# (it also runs on every push). The finished jar is attached to the run as "clicks-client-jar".

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.1

      - name: Build
        run: gradle build --no-daemon

      - name: Keep the logic tests honest
        run: |
          mkdir -p logic-out
          javac -d logic-out src/main/java/dev/clicksclient/core/*.java src/test/java/SelfTest.java
          java -cp logic-out SelfTest

      - uses: actions/upload-artifact@v4
        with:
          name: clicks-client-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
